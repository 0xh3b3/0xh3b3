<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(0,0,0,0.18)"/>
    </pattern>
  </defs>

  <rect width="900" height="80" fill="#0A0F0C"/>

  <rect x="10" y="8" width="880" height="64" fill="none" stroke="#4FFFB0" stroke-width="1" opacity="0.6"/>

  <polyline points="10,28 10,8 30,8" fill="none" stroke="#4FFFB0" stroke-width="2.5"/>
  <polyline points="870,8 890,8 890,28" fill="none" stroke="#4FFFB0" stroke-width="2.5"/>
  <polyline points="10,52 10,72 30,72" fill="none" stroke="#4FFFB0" stroke-width="2.5"/>
  <polyline points="870,72 890,72 890,52" fill="none" stroke="#4FFFB0" stroke-width="2.5"/>

  <line x1="200" y1="8" x2="200" y2="14" stroke="#4FFFB0" stroke-width="1" opacity="0.4"/>
  <line x1="450" y1="8" x2="450" y2="16" stroke="#4FFFB0" stroke-width="1" opacity="0.5"/>
  <line x1="700" y1="8" x2="700" y2="14" stroke="#4FFFB0" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="72" x2="200" y2="66" stroke="#4FFFB0" stroke-width="1" opacity="0.4"/>
  <line x1="450" y1="72" x2="450" y2="64" stroke="#4FFFB0" stroke-width="1" opacity="0.5"/>
  <line x1="700" y1="72" x2="700" y2="66" stroke="#4FFFB0" stroke-width="1" opacity="0.4"/>

  <rect x="330" y="4" width="240" height="16" fill="#0A0F0C"/>
  <text x="450" y="16" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#4FFFB0" opacity="0.5" letter-spacing="3">TERMINAL.SESSION</text>

  <text x="450" y="51" text-anchor="middle" font-family="Fira Code, monospace" font-size="30" font-weight="700" fill="#4FFFB0" filter="url(#glow)" letter-spacing="6">[ TERMINAL.SESSION ]</text>

  <rect x="10" y="8" width="880" height="64" fill="url(#scan)" opacity="0.6"/>
</svg>
